name: auth settings

# Daily: production Supabase must not accept public sign-ups.
# See scripts/check-auth-settings.mjs for why. Needs two repository secrets:
# SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signups-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Public sign-ups are off
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-auth-settings.mjs
